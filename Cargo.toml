[package]
name = "rust-wakatime-dashboard"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
chrono = "0.4.44"
dirs = "6.0.0"
eframe = "0.33.3"
open = "5.3.3"
pkce = "0.2.0"
rand = "0.10.0"
reqwest = { version = "0.13.2", features = ["json", "blocking", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tiny_http = "0.12.0"
tokio = { version = "1.50.0", features = ["full"] }
